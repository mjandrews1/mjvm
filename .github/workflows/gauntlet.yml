name: GAUNTLET

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  gauntlet:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build mJVM
        run: |
          mkdir -p build
          find src/main/java -name "*.java" | xargs javac -cp "lib/*" -d build 2>&1
          find bench -name "*.java" | xargs javac -cp "build:lib/*" -d build 2>&1
          find src/test/java -name "*.java" | xargs javac -cp "build:lib/*" -d build 2>&1
          echo "Build OK: $(find build -name '*.class' | wc -l) classes"

      - name: Run GAUNTLET
        env:
          # u04 runner: 2014 dual-core i5 + HDD; store-backed ops run ~2x slower than dev Macs
          GAUNTLET_GLOBAL_GATE_NS: '4000'
        run: |
          java -cp "build:lib/*" jvmumps.GauntletRun 2>&1
          echo "GAUNTLET PASSED"

      - name: Run MFrontend regression
        run: |
          java -cp "build:lib/*" jvmumps.MFrontendRegression 2>&1
          echo "REGRESSION PASSED"

      - name: REPL smoke (scripted, both shells)
        run: |
          printf 'W "ok",!\nS X=5 W X,!\n/quit\n' | java -cp "build:lib/*" jvmumps.Repl | grep -q 'ok'
          printf 'W "ok",!\nS X=5 W X,!\n/quit\n' | java -cp "build:lib/*" mjvm.cli.Repl | grep -q 'ok'
          echo "REPL SMOKE PASSED"

      - name: Run conformance corpus
        run: |
          if [ -f tests/conformance.json ]; then
            java -cp "build:lib/*" jvmumps.MjvmCorpusScore tests/conformance.json 2>&1
          else
            echo "No conformance.json found, skipping"
          fi

      - name: Run concurrency stress test
        run: |
          java -cp "build:lib/*" jvmumps.StoreConcurrencySmoke 2>&1
          echo "CONCURRENCY PASSED"

      - name: Run latency benchmark
        run: |
          java -cp "build:lib/*" jvmumps.LatencyBench 2>&1
          echo "LATENCY BENCH PASSED"

      - name: Run BankFull benchmark (Java)
        run: |
          echo "=== BankFull: Java native ==="
          java -cp "build:lib/*" jvmumps.BankFull 10000 4 25000 2>&1
          echo "JAVA BENCH PASSED"

      - name: Run BankFull benchmark (mJVM JIT)
        run: |
          echo "=== BankFull: mJVM JIT ==="
          java -cp "build:lib/*" jvmumps.BankExpansive --accounts 10000 --instances 4 --txn 25000 --machine ci --language mJVM --jit 2>&1
          echo "JIT BENCH PASSED"

      - name: Run BankFull benchmark (mJVM IR)
        run: |
          echo "=== BankFull: mJVM IR ==="
          java -cp "build:lib/*" jvmumps.BankExpansive --accounts 10000 --instances 4 --txn 25000 --machine ci --language mJVM 2>&1
          echo "IR BENCH PASSED"
